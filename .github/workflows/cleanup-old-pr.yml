name: Weekly Oldest PR Cleanup

on:
  schedule:
    # Run at 00:00 on Monday
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  close-oldest-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close oldest open PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Find the oldest open PR
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 1
            });

            if (prs.length === 0) {
              console.log('No open PRs found.');
              return;
            }

            const oldestPr = prs[0];
            console.log(`Found oldest PR: #${oldestPr.number} "${oldestPr.title}" created at ${oldestPr.created_at}`);

            // Add a comment explaining why it's being closed
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: oldestPr.number,
              body: "🧹 This PR is being automatically closed as part of our weekly cleanup policy to keep the backlog fresh. We close the single oldest open PR once a week.\n\nThank you for your contribution! If this is still relevant, please feel free to reopen or submit a new PR."
            });

            // Close the PR
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: oldestPr.number,
              state: 'closed'
            });

            console.log(`Successfully closed PR #${oldestPr.number}`);
