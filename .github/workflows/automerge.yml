name: Merge top-voted PR daily

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge-top-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build voting module
        run: npm run build:voting

      - name: Merge highest-voted mergeable PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { getRankedPRs, evaluatePR } = require('./.github/workflows/voting.js');
            const { owner, repo } = context.repo;

            const ranked = await getRankedPRs(github, owner, repo);
            if (ranked.length === 0) { console.log("No open PRs found."); return; }

            console.log("=== PR Rankings ===");
            for (const pr of ranked) {
              console.log(`#${pr.number} — ${pr.votes} net votes — "${pr.title}" by @${pr.author}`);
            }
            console.log("===================\n");

            for (let rank = 0; rank < ranked.length; rank++) {
              const pr = ranked[rank];
              if (pr.votes <= 0) {
                console.log(`PR #${pr.number} has ${pr.votes} net votes — stopping (no positive-vote PRs remain).`);
                break;
              }

              console.log(`\nEvaluating PR #${pr.number} (${pr.votes} net votes)...`);
              try {
                const result = await evaluatePR(github, owner, repo, pr);
                if (!result.ok) {
                  console.log(`  PR #${pr.number} ${result.reason} — skipping.`);
                  continue;
                }
              } catch (err) {
                console.log(`  ERROR: Failed to evaluate PR #${pr.number}: ${err.message}. Trying next PR.`);
                continue;
              }

              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
                console.log(`\nMerged PR #${pr.number} by @${pr.author}: "${pr.title}" (${pr.votes} net votes)`);

                const body = [
                  `This PR won the daily race,`,
                  `Merged with chaos, grace, and pace!`,
                  ``,
                  `**Votes:** +${pr.votes} net (${pr.thumbsUp} :+1: / ${pr.thumbsDown} :-1:)`,
                  `**Rank:** #${rank + 1} of ${ranked.length} open PRs`,
                  `**Author:** @${pr.author}`,
                ].join('\n');
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                return;
              } catch (mergeErr) {
                console.log(`  ERROR: Failed to merge PR #${pr.number}: ${mergeErr.message}. Trying next PR.`);
              }
            }

            console.log("\nNo mergeable PR with positive votes found.");
            core.warning("Daily merge did not occur: no mergeable PR with positive votes and a rhyming title was found.");
