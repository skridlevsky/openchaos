name: Merge top-voted PR weekly

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-top-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Merge highest-voted PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 🎉 FUN RANDOM MESSAGES 🎉
            const celebrationMessages = [
              "🎉 JACKPOT! 🎉",
              "🎰 WINNER WINNER CHICKEN DINNER! 🍗",
              "💎 DIAMOND HANDS! 💎",
              "🚀 TO THE MOON! 🌕",
              "🏆 CROWN JEWEL! 👑",
              "⚡ LIGHTNING STRIKE! ⚡",
              "🎪 BIG TOP WINNER! 🎪",
              "🎲 ROLLING IN IT! 🎲",
              "💰 BIG BUCKS! 💸",
              "🔥 FIRE ROUND WINNER! 🔥"
            ];

            const memeEmojis = [
              ["💎", "🚀", "🌙", "🎯", "💸", "🎲", "🎪", "🎨", "🎭", "🎮"],
              ["🎵", "🎸", "🎺", "🎻", "🥁", "🎹", "🎷", "🎤", "🎧", "🎬"],
              ["🎉", "🎊", "🎁", "🎈", "🎆", "🎇", "✨", "🌟", "⭐", "💫"],
              ["🦾", "🦿", "🧠", "🦸", "🦹", "🧛", "🧜", "🧚", "🧝", "🧞"]
            ];

            async function getOpenPRs() {
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                per_page: 100
              });

              const prsWithVotes = await Promise.all(
                prs.data.map(async (pr) => {
                  const reactions = await github.rest.reactions.listForIssue({
                    owner,
                    repo,
                    issue_number: pr.number,
                    per_page: 100
                  });

                  const plusOneReactions = reactions.data.filter(r => r.content === '+1');
                  const votes = plusOneReactions.length;
                  const voters = plusOneReactions.map(r => r.user.login);

                  return {
                    number: pr.number,
                    title: pr.title,
                    author: pr.user.login,
                    votes,
                    voters
                  };
                })
              );

              prsWithVotes.sort((a,b) => b.votes - a.votes);

              return prsWithVotes;
            }

            // 🎰 POST WINNER COMMENT 🎰
            async function announceWinner(pr, winner) {
              const celebration = celebrationMessages[Math.floor(Math.random() * celebrationMessages.length)];
              const randomEmoji1 = memeEmojis[0][Math.floor(Math.random() * memeEmojis[0].length)];
              const randomEmoji2 = memeEmojis[2][Math.floor(Math.random() * memeEmojis[2].length)];
              const randomEmoji3 = memeEmojis[3][Math.floor(Math.random() * memeEmojis[3].length)];

              const commentBody =
`# ${celebration}

---

## 🎰 **RANDOM WINNER SELECTED!** 🎰

### 🏆 **@${winner}** 

---

## 🎲 **THE NUMBERS:**
- **PR #${pr.number}**: "${pr.title}" by @${pr.author}
- **Total Votes**: ${pr.votes} 👍
- **Total Voters**: ${pr.voters.length} people
- **Your Odds**: 1 in ${pr.voters.length} (${(100/pr.voters.length).toFixed(1)}%)

---

## 🎊 **YOUR PRIZE AWAITS!** 🎊

💵 **$100 USD** OR 🪙 **CRYPTO EQUIVALENT**

Paid by @${owner} via the community bounty program!

---

## 📜 **HOW TO CLAIM:**

1. 📧 Check your GitHub notifications for DM from @${owner}
2. 💬 Or open an issue titled "🎰 BOUNTY CLAIM: @${winner}"
3. ✅ Include your payment preference (PayPal, Venmo, crypto wallet, etc.)
4. 🎁 Prize sent within 24 hours!

---

## 🎭 **THANKS TO ALL VOTERS!** 🎭

${pr.voters.map(v => `@${v} ${randomEmoji1}`).join(' • ')}

---

## 🎪 **NEXT TIME...**

👍 Upvote upcoming PRs for your shot at $100!
🎲 Random winner EVERY merge!
💸 May the odds be ever in your favor!

---

${randomEmoji2}${randomEmoji2}${randomEmoji2} **CHAOS REIGNS!** ${randomEmoji3}${randomEmoji3}${randomEmoji3}

> *Winner selected via cryptographically secure random selection* 🎲🔒`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: commentBody
              });

              console.log(`✅ Posted winner announcement on PR #${pr.number}`);
            }

            const openPRs = await getOpenPRs();
            if (openPRs.length === 0) {
              console.log("No open PRs found.");
              return;
            }

            let mergedPR = null;

            for (const pr of openPRs) {
              console.log(`Checking PR (#${pr.number}) by @${pr.author}: ${pr.title} with ${pr.votes} votes`);

              if (pr.votes === 0) {
                console.log("No votes — skipping merge.");
                continue;
              }

              const prDetails = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number
              });

              const { mergeable, mergeable_state, draft } = prDetails.data;

              console.log(`  - mergeable: ${mergeable}, mergeable_state: ${mergeable_state}, draft: ${draft}`);

              if (draft) {
                console.log(`  - Draft PR, skipping`);
                continue;
              }

              if (mergeable !== true || mergeable_state !== 'clean') {
                console.log(`  - Not ready to merge (${mergeable_state}), skipping`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                console.log(`Merged PR #${pr.number}`);

                // 🎲 SELECT AND ANNOUNCE RANDOM WINNER 🎲
                if (pr.voters.length > 0) {
                  const randomVoter = pr.voters[Math.floor(Math.random() * pr.voters.length)];
                  console.log(`🎲 Random voter for this PR: @${randomVoter}`);
                  await announceWinner(pr, randomVoter);
                } else {
                  console.log("⚠️ No voters to select from, skipping winner announcement");
                }

                mergedPR = pr;
                break;
              } catch (error) {
                console.log(`  - Merge failed: ${error.message}`);
                continue;
              }
            }

            if (!mergedPR) {
              console.log("No mergeable PR found with votes.");
            }
