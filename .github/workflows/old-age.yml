name: Old Age - Natural Selection for PRs

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  old-age:
    runs-on: ubuntu-latest
    steps:
      - name: Process aging PRs with natural selection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Algorithm constants
            const BASE_DEATH_CHANCE = 0.1;
            const UNMERGEABLE_BASE_PENALTY = 5;
            const UNMERGEABLE_MULTIPLIER = 400;

            function calculateDeathProbability(ageDays, interactions, isUnmergeable) {
              let deathChance = BASE_DEATH_CHANCE;

              // Exponential age penalty - gets worse FAST
              const agePenalty = Math.pow(ageDays, 1.6) * 0.06;
              deathChance += agePenalty;

              // Logarithmic fitness - diminishing returns, first interactions matter most
              const logFitness = Math.log(interactions + 1) * 3.0;

              // Age scaling: fitness matters more as you age
              const ageScale = 0.5 + (ageDays / 90);

              // Reduce death chance based on logarithmic fitness (scaled by age)
              deathChance -= logFitness * ageScale;

              // Apply unmergeable penalties (additive + multiplicative)
              if (isUnmergeable) {
                deathChance += UNMERGEABLE_BASE_PENALTY;
                deathChance = deathChance * (1 + UNMERGEABLE_MULTIPLIER / 100);
              }

              // Clamp between 0 and 100
              return Math.max(0, Math.min(100, deathChance));
            }

            // Get all open PRs (paginated)
            let prs = [];
            try {
              let page = 1;
              while (true) {
                const { data } = await github.rest.pulls.list({
                  owner, repo, state: "open", per_page: 100, page
                });
                prs = prs.concat(data);
                if (data.length < 100) break;
                page++;
              }
            } catch (err) {
              core.setFailed(`Failed to fetch open PRs: ${err.message}`);
              return;
            }

            if (prs.length === 0) {
              console.log("No open PRs to process.");
              return;
            }

            console.log(`Found ${prs.length} open PRs`);
            console.log("\n" + "=".repeat(80));
            console.log("PROCESSING PRs FOR OLD AGE");
            console.log("=".repeat(80) + "\n");

            const deaths = [];
            let skippedCount = 0;

            for (const pr of prs) {
              try {
                const createdAt = new Date(pr.created_at);
                const now = new Date();
                const ageDays = Math.floor((now - createdAt) / (1000 * 60 * 60 * 24));

                // Fetch full PR details and interactions in parallel
                // pulls.list does NOT return mergeable/mergeable_state fields,
                // so we must call pulls.get individually for each PR.
                // Note: mergeable can be null while GitHub computes it
                const [fullPr, comments, reactions, reviews] = await Promise.all([
                  github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: pr.number
                  }),
                  github.paginate(github.rest.issues.listComments, {
                    owner,
                    repo,
                    issue_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.reactions.listForIssue, {
                    owner,
                    repo,
                    issue_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.pulls.listReviews, {
                    owner,
                    repo,
                    pull_number: pr.number,
                    per_page: 100
                  })
                ]);

                const interactions = comments.length + reactions.length + reviews.length;

                // Retry up to 3 times if mergeability hasn't been computed yet
                let mergeable = fullPr.data.mergeable;
                let mergeableState = fullPr.data.mergeable_state;
                let retries = 0;
                while (mergeable === null && retries < 3) {
                  retries++;
                  const delay = retries * 3000;
                  console.log(`  PR #${pr.number}: mergeability not computed, retry ${retries}/3 in ${delay}ms...`);
                  await new Promise(r => setTimeout(r, delay));
                  const retry = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                  mergeable = retry.data.mergeable;
                  mergeableState = retry.data.mergeable_state;
                }

                if (mergeable === null) {
                  core.warning(`PR #${pr.number}: mergeability not computed after ${retries} retries, skipping this cycle.`);
                  continue;
                }

                // Check if unmergeable (conflicts or can't merge)
                const isUnmergeable =
                  mergeable === false ||
                  mergeableState === 'dirty' ||
                  mergeableState === 'conflicting';

                const deathProb = calculateDeathProbability(ageDays, interactions, isUnmergeable);

                const roll = Math.random() * 100;
                const died = roll < deathProb;

                const status = died ? "💀 DIED" : "✓ SURVIVED";
                const unmergeableFlag = isUnmergeable ? " [UNMERGEABLE]" : "";

                console.log(`PR #${pr.number} | ${ageDays}d | ${interactions} int | ${deathProb.toFixed(2)}% | Roll: ${roll.toFixed(2)} | ${status}${unmergeableFlag}`);

                if (died) {
                  deaths.push({
                    pr,
                    ageDays,
                    interactions,
                    deathProb,
                    roll,
                    isUnmergeable
                  });
                }
              } catch (err) {
                skippedCount++;
                core.warning(`Failed to process PR #${pr.number}: ${err.message}. Skipping.`);
                continue;
              }
            }

            if (skippedCount === prs.length) {
              core.setFailed(`All ${prs.length} PRs failed processing. This likely indicates a systemic issue (rate limiting, auth failure, etc.).`);
              return;
            }
            if (skippedCount > 0) {
              core.warning(`${skippedCount}/${prs.length} PRs skipped due to errors.`);
            }

            // Process deaths — cap at 1 per day
            if (deaths.length === 0) {
              console.log("\n✓ No PRs died today. All survived natural selection.");
              return;
            }

            // Only the weakest PR dies each day — pick highest death probability
            deaths.sort((a, b) => b.deathProb - a.deathProb);
            const todaysVictim = deaths[0];

            if (deaths.length > 1) {
              console.log(`\n${deaths.length} PRs failed their rolls, but only 1 death per day is allowed.`);
              console.log(`Spared: ${deaths.slice(1).map(d => `#${d.pr.number}`).join(', ')}`);
            }

            console.log("\n" + "=".repeat(80));
            console.log(`💀 1 PR DIED FROM OLD AGE`);
            console.log("=".repeat(80) + "\n");

            const death = todaysVictim;
            console.log(`Closing PR #${death.pr.number}: ${death.pr.title}`);

            const unmergeableNote = death.isUnmergeable
              ? "\n\n⚠️ **Unmergeable Status:** This PR had merge conflicts, which significantly increased mortality risk."
              : "";

            const fitnessNote = death.interactions < 10
              ? "\n\n💔 **Low Engagement:** This PR received minimal attention and care."
              : death.interactions > 50
              ? "\n\n💚 **High Engagement:** Despite significant community love, time caught up."
              : "";

            const deathMessage = [
              "⏳ **SUCCUMBED TO OLD AGE** ⏳",
              "",
              `This PR has died from natural causes after ${death.ageDays} days.`,
              "",
              "**Mortality Report:**",
              `- Age: ${death.ageDays} days`,
              `- Fitness (interactions): ${death.interactions}`,
              `- Death probability: ${death.deathProb.toFixed(2)}%`,
              `- Fatal roll: ${death.roll.toFixed(2)}`,
              unmergeableNote,
              fitnessNote,
              "",
              "*In the chaos world, PRs must move fast or perish. Only sustained engagement and timely merges can fight the effects of aging.*",
              "",
              "**Senectus ipsa est morbus.** (Old age itself is a disease.)",
              "",
              "🔒 **This PR has been locked. No resurrection is possible.**",
              "",
              "---",
              "🕊️ May this PR rest in the git log."
            ].join("\n");

            try {
              // Close first — if subsequent steps (comment, label, lock) fail,
              // the PR is still dead. The close is the only irreversible action.
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: death.pr.number,
                state: "closed"
              });

              const postCloseFailures = [];

              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: death.pr.number, body: deathMessage
                });
              } catch (e) {
                postCloseFailures.push('comment');
                core.warning(`Failed to add death comment to #${death.pr.number}: ${e.message}`);
              }

              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: death.pr.number, labels: ['dead']
                });
              } catch (e) {
                postCloseFailures.push('label');
                core.warning(`Failed to add 'dead' label to #${death.pr.number}: ${e.message}`);
              }

              try {
                await github.rest.issues.lock({
                  owner, repo, issue_number: death.pr.number, lock_reason: 'resolved'
                });
              } catch (e) {
                postCloseFailures.push('lock');
                core.warning(`Failed to lock #${death.pr.number}: ${e.message}`);
              }

              if (postCloseFailures.length > 0) {
                console.log(`✓ Closed PR #${death.pr.number} (but failed: ${postCloseFailures.join(', ')})`);
              } else {
                console.log(`✓ Closed and locked PR #${death.pr.number}`);
              }
            } catch (err) {
              core.setFailed(`Failed to close PR #${death.pr.number}: ${err.message}`);
            }

            console.log(`\n💀 Old age claimed 1 PR today.`);
